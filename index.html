<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leebox</title>
<style>
body{font-family:sans-serif;background:#0f0f13;color:#e8e8f0;padding:16px;margin:0}
h1{color:#7c6bff;margin-bottom:16px}
.card{background:#1a1a23;border-radius:12px;padding:14px;border:1px solid #2e2e3e;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.lbl{font-size:11px;color:#888;margin-bottom:4px}
.big{font-size:26px;font-weight:700}
.form{background:#1a1a23;border-radius:12px;padding:16px;border:1px solid #7c6bff;margin-bottom:16px}
.form h3{margin-bottom:12px;color:#7c6bff}
label{font-size:12px;color:#888;display:block;margin-bottom:4px;margin-top:10px}
input,select{width:100%;background:#0f0f13;border:1px solid #2e2e3e;border-radius:8px;padding:10px;color:#e8e8f0;font-size:15px;font-family:sans-serif;box-sizing:border-box}
.btn{display:block;width:100%;padding:13px;border-radius:10px;border:none;background:#7c6bff;color:#fff;font-size:16px;font-weight:700;font-family:sans-serif;margin-top:14px;cursor:pointer}
.row{display:grid;grid-template-columns:70px 55px 80px 1fr 30px;gap:6px;padding:10px 12px;background:#1a1a23;border-radius:10px;border:1px solid #2e2e3e;font-size:13px;align-items:center;margin-bottom:4px}
.hrow{display:grid;grid-template-columns:70px 55px 80px 1fr 30px;gap:6px;padding:6px 12px;font-size:11px;color:#888;margin-bottom:4px}
.x{background:none;border:none;color:#f44;font-size:16px;cursor:pointer;padding:0}
</style>
</head>
<body>
<h1>Leebox</h1>

<div class="form">
<h3>＋ 新增記錄</h3>
<label>日期</label>
<input type="date" id="idate">
<label>類別</label>
<select id="icat">
<option value="網路">網路</option>
<option value="實體">實體</option>
<option value="東區">東區</option>
</select>
<label>金額</label>
<input type="number" id="iamt" placeholder="0">
<label>備註（選填）</label>
<input type="text" id="inote" placeholder="">
<button class="btn" id="savebtn">儲存記錄</button>
</div>

<div class="card" style="border-color:#7c6bff;margin-bottom:10px">
<div class="lbl">總銷售</div>
<div class="big" style="color:#7c6bff" id="st">$0</div>
</div>
<div class="grid2">
<div class="card"><div class="lbl">網路</div><div class="big" style="color:#6bffc8" id="so">$0</div></div>
<div class="card"><div class="lbl">實體</div><div class="big" style="color:#ff9f6b" id="ss">$0</div></div>
<div class="card"><div class="lbl">東區</div><div class="big" style="color:#ff6b9d" id="se">$0</div></div>
</div>

<div class="hrow"><span>日期</span><span>類別</span><span>金額</span><span>備註</span><span></span></div>
<div id="rl"><div style="text-align:center;padding:20px;color:#888">尚無記錄</div></div>

<script>
var R = JSON.parse(localStorage.getItem('lb') || '[]');

document.getElementById('idate').value = new Date().toISOString().slice(0,10);

function fmt(n){ return '$' + Number(n).toLocaleString(); }

function render(){
  var total = R.reduce(function(s,r){ return s+r.a; }, 0);
  var online = R.filter(function(r){ return r.c==='網路'; }).reduce(function(s,r){ return s+r.a; }, 0);
  var store = R.filter(function(r){ return r.c==='實體'; }).reduce(function(s,r){ return s+r.a; }, 0);
  var east = R.filter(function(r){ return r.c==='東區'; }).reduce(function(s,r){ return s+r.a; }, 0);
  document.getElementById('st').textContent = fmt(total);
  document.getElementById('so').textContent = fmt(online);
  document.getElementById('ss').textContent = fmt(store);
  document.getElementById('se').textContent = fmt(east);
  var rl = document.getElementById('rl');
  if(R.length === 0){
    rl.innerHTML = '<div style="text-align:center;padding:20px;color:#888">尚無記錄</div>';
    return;
  }
  var sorted = R.slice().sort(function(a,b){ return b.d.localeCompare(a.d); });
  rl.innerHTML = sorted.map(function(r){
    return '<div class="row"><span>'+r.d.slice(5)+'</span><span>'+r.c+'</span><span>'+fmt(r.a)+'</span><span style="color:#888;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+(r.n||'—')+'</span><button class="x" onclick="del(\''+r.id+'\')">×</button></div>';
  }).join('');
}

document.getElementById('savebtn').onclick = function(){
  var d = document.getElementById('idate').value;
  var c = document.getElementById('icat').value;
  var a = parseFloat(document.getElementById('iamt').value) || 0;
  var n = document.getElementById('inote').value;
  if(!d){ alert('請填寫日期'); return; }
  R.push({ id: Date.now().toString(), d:d, c:c, a:a, n:n });
  localStorage.setItem('lb', JSON.stringify(R));
  document.getElementById('iamt').value = '';
  document.getElementById('inote').value = '';
  render();
};

function del(id){
  if(!confirm('確定刪除？')) return;
  R = R.filter(function(r){ return r.id !== id; });
  localStorage.setItem('lb', JSON.stringify(R));
  render();
}

render();
</script>
</body>
</html>
