nt('button');b.className='chip'+(m==='全部'?' on':'');b.textContent=m==='全部'?'全部月份':m+'月';b.setAttribute('data-m',m);mc.appendChild(b);});yc.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;fy=b.getAttribute('data-y');yc.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');render();});mc.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;fm=b.getAttribute('data-m');mc.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');render();});document.getElementById('cc').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;fc=b.getAttribute('data-c');document.getElementById('cc').querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');render();});document.getElementById('sq').addEventListener('input',render);function fmt(n){return'$'+Number(n).toLocaleString();}function render(){var q=document.getElementById('sq').value.toLowerCase();var base=R.filter(function(r){var yr=String(new Date(r.d).getFullYear());var mo=String(new Date(r.d).getMonth()+1);return(fy==='全部'||yr===fy)&&(fm==='全部'||mo===fm);});var f=base.filter(function(r){return(fc==='全部'||r.c===fc)&&(!q||r.n.toLowerCase().includes(q));});document.getElementById('st').textContent=fmt(base.reduce(function(s,r){return s+r.a;},0));document.getElementById('so').textContent=fmt(base.filter(function(r){return r.c==='網路';}).reduce(function(s,r){return s+r.a;},0));document.getElementById('ss').textContent=fmt(base.filter(function(r){return r.c==='實體';}).reduce(function(s,r){return s+r.a;},0));document.getElementById('se').textContent=fmt(base.filter(function(r){return r.c==='東區';}).reduce(function(s,r){return s+r.a;},0));document.getElementById('rc').textContent=f.length+' 筆記錄';var rl=document.getElementById('rl');if(!f.length){rl.innerHTML='<div style="text-align:center;padding:20px;color:#888">沒有符合的記錄</div>';re
