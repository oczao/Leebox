<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Leebox</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#0f0f13;color:#e8e8f0;padding:16px}:root{--accent:#7c6bff;--accent2:#ff6b9d;--online:#6bffc8;--store:#ff9f6b;--east:#ff6b9d;--surface:#1a1a23;--border:#2e2e3e;--text2:#888899}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.logo{font-size:22px;font-weight:700;background:linear-gradient(90deg,#7c6bff,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.add-btn{background:linear-gradient(135deg,#7c6bff,#ff6b9d);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}.stat-card{background:var(--surface);border-radius:14px;padding:14px 16px;border:1px solid var(--border)}.stat-card.total{grid-column:1/-1;border-color:var(--accent)}.stat-label{font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase}.stat-value{font-size:24px;font-weight:700}.stat-card.total .stat-value{color:#7c6bff;font-size:28px}.stat-card:nth-child(2) .stat-value{color:#6bffc8}.stat-card:nth-child(3) .stat-value{color:#ff9f6b}.stat-card:nth-child(4) .stat-value{color:#ff6b9d}.section-title{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}.month-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}.chip{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2)}.chip.active{background:#7c6bff;border-color:#7c6bff;color:#fff}.cat-chips{display:flex;gap:6px;margin-bottom:14px}.cat-chip[data-cat="網路"].active{background:#6bffc8;border-color:#6bffc8;color:#000}.cat-chip[data-cat="實體"].active{background:#ff9f6b;border-color:#ff9f6b;color:#000}.cat-chip[data-cat="東區"].active{background:#ff6b9d;border-color:#ff6b9d;color:#fff}.search-wrap{position:relative;margin-bottom:16px}.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px 10px 38px;color:#e8e8f0;font-size:14px;outline:none}.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text2)}.table-header{display:grid;grid-template-columns:70px 55px 75px 1fr;gap:8px;padding:8px 12px;font-size:11px;color:var(--text2);text-transform:uppercase;border-bottom:1px solid var(--border);margin-bottom:4px}.record-list{display:flex;flex-direction:column;gap:4px}.record-item{display:grid;grid-template-columns:70px 55px 75px 1fr;gap:8px;padding:12px;background:var(--surface);border-radius:10px;border:1px solid var(--border);font-size:13px;cursor:pointer;align-items:center}.cat-badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700}.cat-badge.網路{background:rgba(107,255,200,.15);color:#6bffc8}.cat-badge.實體{background:rgba(255,159,107,.15);color:#ff9f6b}.cat-badge.東區{background:rgba(255,107,157,.15);color:#ff6b9d}.note{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;padding:40px 20px;color:var(--text2)}.record-count{font-size:12px;color:var(--text2);margin-bottom:8px}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:flex-end;justify-content:center}.modal-overlay.open{display:flex}.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;border-top:1px solid var(--border)}.modal-title{font-size:18px;font-weight:700;margin-bottom:20px}.form-group{margin-bottom:14px}.form-label{font-size:12px;color:var(--text2);margin-bottom:6px;display:block}.form-input,.form-select{width:100%;background:#0f0f13;border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:#e8e8f0;font-size:15px;font-family:sans-serif;outline:none}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;gap:10px;margin-top:20px}.btn-cancel{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:15px;cursor:pointer}.btn-save{flex:2;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#7c6bff,#ff6b9d);color:#fff;font-size:15px;font-weight:700;cursor:pointer}.btn-delete{width:100%;padding:12px;border-radius:10px;border:1px solid #ff4444;background:transparent;color:#ff4444;font-size:14px;cursor:pointer;margin-top:8px}</style></head><body><div class="header"><div class="logo">Leebox</div><button class="add-btn" onclick="openAdd()">＋ 新增</button></div><div class="stats"><div class="stat-card total"><div class="stat-label">總銷售</div><div class="stat-value" id="stat-total">$0</div></div><div class="stat-card"><div class="stat-label">網路</div><div class="stat-value" id="stat-online">$0</div></div><div class="stat-card"><div class="stat-label">實體</div><div class="stat-value" id="stat-store">$0</div></div><div class="stat-card"><div class="stat-label">東區</div><div class="stat-value" id="stat-east">$0</div></div></div><div class="section-title">月份</div><div class="month-scroll" id="monthChips"></div><div class="cat-chips" id="catChips"><button class="chip cat-chip active" data-cat="全部" onclick="setCat(this)">全部</button><button class="chip cat-chip" data-cat="網路" onclick="setCat(this)">網路</button><button class="chip cat-chip" data-cat="實體" onclick="setCat(this)">實體</button><button class="chip cat-chip" data-cat="東區" onclick="setCat(this)">東區</button></div><div class="search-wrap"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="搜尋名稱..." oninput="render()"></div><div class="record-count" id="recordCount">0 筆記錄</div><div class="table-header"><span>日期</span><span>類別</span><span>金額</span><span>備註</span></div><div class="record-list" id="recordList"></div><div class="modal-overlay" id="modal"><div class="modal"><div class="modal-title" id="modalTitle">新增記錄</div><div class="form-row"><div class="form-group"><label class="form-label">日期</label><input type="date" class="form-input" id="inputDate"></div><div class="form-group"><label class="form-label">類別</label><select class="form-select" id="inputCat"><option>網路</option><option>實體</option><option>東區</option></select></div></div><div class="form-group"><label class="form-label">金額</label><input type="number" class="form-input" id="inputAmount" placeholder="0"></div><div class="form-group"><label class="form-label">備註</label><input type="text" class="form-input" id="inputNote" placeholder="選填"></div><div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-save" onclick="saveRecord()">儲存</button></div><button class="btn-delete" id="deleteBtn" onclick="deleteRecord()" style="display:none">刪除此記錄</button></div></div><script>const MONTHS=['全部','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];let records=JSON.parse(localStorage.getItem('leebox')||'[]');let filterMonth='全部',filterCat='全部',editId=null;const mc=document.getElementById('monthChips');MONTHS.forEach(m=>{const b=document.createElement('button');b.className='chip'+(m==='全部'?' active':'');b.textContent=m;b.onclick=()=>{filterMonth=m;mc.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));b.classList.add('active');render()};mc.appendChild(b)});function setCat(el){filterCat=el.dataset.cat;document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');render()}function fmt(n){return'$'+Number(n).toLocaleString()}function render(){const q=document.getElementById('searchInput').value.toLowerCase();let f=records.filter(r=>{const mm=filterMonth==='全部'||new Date(r.date).getMonth()+1===parseInt(filterMonth);const cm=filterCat==='全部'||r.cat===filterCat;const sm=!q||r.note.toLowerCase().includes(q);return mm&&cm&&sm});let base=records.filter(r=>filterMonth==='全部'||new Date(r.date).getMonth()+1===parseInt(filterMonth));document.getElementById('stat-total').textContent=fmt(base.reduce((s,r)=>s+r.amount,0));document.getElementById('stat-online').textContent=fmt(base.filter(r=>r.cat==='網路').reduce((s,r)=>s+r.amount,0));document.getElementById('stat-store').textContent=fmt(base.filter(r=>r.cat==='實體').reduce((s,r)=>s+r.amount,0));document.getElementById('stat-east').textContent=fmt(base.filter(r=>r.cat==='東區').reduce((s,r)=>s+r.amount,0));document.getElementById('recordCount').textContent=f.length+' 筆記錄';const list=document.getElementById('recordList');if(f.length===0){list.innerHTML='<div class="empty">沒有符合的記錄</div>';return}f.sort((a,b)=>b.date.localeCompare(a.date));list.innerHTML=f.map(r=>`<div class="record-item" onclick="openEdit('${r.id}')"><span>${r.date.slice(5)}</span><span><span class="cat-badge ${r.cat}">${r.cat}</span></span><span style="font-weight:700">${fmt(r.amount)}</span><span class="note">${r.note||'—'}</span></div>`).join('')}function openAdd(){editId=null;document.getElementById('modalTitle').textContent='新增記錄';document.getElementById('inputDate').value=new Date().toISOString().slice(0,10);document.getElementById('inputCat').value='網路';document.getElementById('inputAmount').value='';document.getElementById('inputNote').value='';document.getElementById('deleteBtn').style.display='none';document.getElementById('modal').classList.add('open')}function openEdit(id){editId=id;const r=records.find(r=>r.id===id);document.getElementById('modalTitle').textContent='編輯記錄';document.getElementById('inputDate').value=r.date;document.getElementById('inputCat').value=r.cat;document.getElementById('inputAmount').value=r.amount;document.getElementById('inputNote').value=r.note;document.getElementById('deleteBtn').style.display='block
